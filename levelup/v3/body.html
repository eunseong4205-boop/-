<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="cine-top" class="cine"></div><div id="cine-bot" class="cine"></div>
    <div id="toasts"></div>
    <div id="banner" hidden><small id="banner-sub"></small><b id="banner-title"></b></div>
    <div id="area" hidden><small id="area-sub"></small><b id="area-name"></b></div>
    <div id="bubbles" aria-hidden="true"></div>
    <div id="dialog" hidden>
      <div id="dlg-face"><canvas id="dlg-cv" width="64" height="64"></canvas></div>
      <div id="dlg-body"><div id="dlg-name"></div><div id="dlg-text"></div></div>
      <div id="dlg-next">◆</div>
    </div>
    <div id="choices" hidden></div>
    <div id="cutin" hidden></div>
    <div id="chapter" hidden><small id="chapter-no"></small><b id="chapter-title"></b><span id="chapter-sub"></span></div>
    <div id="modal" hidden></div>
    <div id="fade"></div>
    <div id="title" hidden></div>
  </div>
  <div id="touch">
    <div id="stickzone"><div id="stick"><div id="knob"></div></div><span class="hint">이동</span></div>
    <div id="btns">
      <button class="tb big a" data-act="attack" aria-label="공격 · 대화"><i>⚔</i><small>공격</small></button>
      <button class="tb b" data-act="dodge" aria-label="구르기"><i>➰</i><small>구르기</small></button>
      <button class="tb x" data-act="bow" aria-label="활"><i>➶</i><small>활</small></button>
      <button class="tb y" data-act="magic" aria-label="마법"><i>✦</i><small>마법</small></button>
      <button class="tb r" data-act="tool" aria-label="도구"><i>◈</i><small>도구</small></button>
      <button class="tb s" data-act="special" aria-label="필살기"><i>✹</i><small>필살</small></button>
    </div>
    <div id="sysbtns">
      <button class="sb" data-act="cycle" aria-label="바꾸기">⇄</button>
      <button class="sb" data-act="map" aria-label="지도">지도</button>
      <button class="sb" data-act="menu" aria-label="메뉴">메뉴</button>
    </div>
  </div>
</div>
