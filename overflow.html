<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16122a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무한 렙업">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="캡이 NULL인 소년의 끝없는 레벨업 — 모바일 방치형 클리커 RPG">
<title>무한 렙업: OVERFLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* 무한 렙업: OVERFLOW — 단일 다크 테마(게임 세계관 고정) */
:root {
  color-scheme: dark;
  --bg: #16122a;
  --bg2: #1d1839;
  --surface: #251f4d;
  --surface2: #2f2862;
  --line: #43397f;
  --text: #f1ecff;
  --muted: #aaa2d6;
  --dim: #7a70ad;
  --gold: #ffcf4a;
  --red: #ff4d5e;
  --cyan: #5fe3f0;
  --mint: #6ee7a8;
  --violet: #b197fc;
  --orange: #ffa94d;
  --display: 'Bagel Fat One', 'IBM Plex Sans KR', system-ui, sans-serif;
  --ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --pixel: 'Silkscreen', 'IBM Plex Sans KR', monospace;
  --radius: 10px;
  --hud-sat: env(safe-area-inset-top, 0px);
  --tabs-sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }

#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 0 1px #0d0a1c, 0 0 60px #00000080;
}

/* ───── HUD ───── */
#hud {
  padding: 8px 12px 6px;
  padding-top: calc(8px + var(--hud-sat));
  background: linear-gradient(180deg, #221c48, var(--bg2));
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 5px;
  flex: none;
}
.hud-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hud-ava { width: 38px; height: 38px; image-rendering: pixelated; flex: none; border-radius: 8px; background: #0f0c20; border: 1px solid var(--line); }
.hud-id { min-width: 0; flex: 1; }
.hud-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-cls { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-lv { text-align: right; flex: none; max-width: 58%; }
.hud-lv small { font-family: var(--pixel); font-size: 10px; color: var(--red); letter-spacing: .08em; display: block; line-height: 1; }
.hud-lv b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.05; color: #fff; text-shadow: 0 2px 0 #b81d33; white-space: nowrap; }
.bar { position: relative; height: 12px; border-radius: 6px; background: #0e0b1f; border: 1px solid #3a3170; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #2fb8e0, var(--cyan)); transition: width .15s linear; }
.bar > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-family: var(--pixel); letter-spacing: .04em; color: #eafcff; text-shadow: 0 1px 0 #000; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 999px; background: #120f26; border: 1px solid #332a66; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip .ic { font-size: 11px; }
.c-gold { color: var(--gold); }
.c-frag { color: var(--violet); }
.c-dps { color: var(--mint); }
.c-red { color: var(--red); }
.c-cyan { color: var(--cyan); }
.c-muted { color: var(--muted); }

/* ───── 전투 ───── */
#battle {
  position: relative;
  flex: none;
  height: clamp(210px, 36vh, 330px);
  background: #0c0a18;
  overflow: hidden;
  touch-action: none;
  cursor: pointer;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.bt-top { position: absolute; top: 6px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; pointer-events: none; }
.zone-lbl { background: #0d0a1ccc; border: 1px solid #ffffff22; border-radius: 8px; padding: 3px 8px; font-size: 12px; font-weight: 700; max-width: 60%; }
.zone-lbl small { display: block; font-weight: 400; font-size: 10.5px; color: var(--muted); }
.bt-nav { display: flex; gap: 4px; pointer-events: auto; }
.bt-nav button, .skill {
  background: #0d0a1cd9; border: 1px solid #ffffff2a; border-radius: 8px; min-width: 34px; height: 32px; padding: 0 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.bt-nav button:active { transform: translateY(1px); }
.bt-nav .on { border-color: var(--mint); color: var(--mint); }
.bt-nav .retry { border-color: var(--gold); color: var(--gold); }
.skills { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 5px; justify-content: flex-end; pointer-events: none; }
.skill { position: relative; width: 38px; min-width: 38px; height: 38px; padding: 0; font-size: 17px; pointer-events: auto; overflow: hidden; }
.skill .cd { position: absolute; inset: auto 0 0 0; height: 0; background: #000000aa; }
.skill .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: var(--pixel); color: #fff; text-shadow: 0 1px 0 #000; }
.skill.active { border-color: var(--gold); box-shadow: 0 0 10px #ffcf4a88 inset; }
.skill.all { font-size: 11px; font-weight: 700; width: auto; padding: 0 8px; color: var(--gold); }

/* ───── 패널 ───── */
#panel { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#panel h2 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 2px 0 8px; letter-spacing: .01em; text-wrap: balance; }
#panel h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.stack { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.small { font-size: 12px; color: var(--muted); }
.tiny { font-size: 11px; color: var(--dim); }
.num { font-variant-numeric: tabular-nums; }
.pix { image-rendering: pixelated; flex: none; }
.btn {
  border: 1px solid #5a4fb0; background: linear-gradient(180deg, #4a3fa8, #3a3190); border-radius: 9px; padding: 7px 10px;
  font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; min-height: 34px; color: #fff;
}
.btn:active { transform: translateY(1px); filter: brightness(1.1); }
.btn:disabled { opacity: .42; cursor: default; transform: none; filter: none; }
.btn.gold { background: linear-gradient(180deg, #ffd660, #e9a92c); border-color: #ffe08a; color: #2a1b00; }
.btn.red { background: linear-gradient(180deg, #ff5b6b, #d72f45); border-color: #ff8a95; }
.btn.mint { background: linear-gradient(180deg, #6ee7a8, #3fbf82); border-color: #9af2c4; color: #0a2a1a; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn.sm { padding: 4px 8px; min-height: 28px; font-size: 11.5px; }
.btn.wide { width: 100%; }
.btn .sub { display: block; font-size: 10.5px; font-weight: 500; opacity: .85; }
.seg { display: inline-flex; background: #120f26; border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface2); color: #fff; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; border: 1px solid currentColor; }
.hr { height: 1px; background: var(--line); margin: 10px 0; }

.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.item .name { font-weight: 700; font-size: 13.5px; }
.item .meta { font-size: 11.5px; color: var(--muted); }
.item .buy { display: grid; gap: 3px; justify-items: end; }
.ico { width: 44px; height: 44px; border-radius: 9px; background: #120f26; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; overflow: hidden; }
.ico img { width: 100%; height: 100%; image-rendering: pixelated; }
.locked { filter: grayscale(1) brightness(.45); }

.stat-row { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed #3a3170; }
.stat-row:last-child { border-bottom: 0; }
.stat-row .sn { font-weight: 700; }
.stat-row .sn small { display: block; font-family: var(--pixel); font-size: 9.5px; color: var(--dim); letter-spacing: .06em; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper b { min-width: 18px; text-align: center; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

.lvbig { font-family: var(--display); font-size: 30px; line-height: 1; color: #fff; text-shadow: 0 3px 0 #b81d33; word-break: break-all; }
.prog { height: 6px; border-radius: 3px; background: #0e0b1f; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--violet); }

.req { display: grid; gap: 3px; font-size: 12.5px; }
.req .ok { color: var(--mint); }
.req .no { color: #ff8a95; }

.orbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.orbs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.orb { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #1a1426; border: 2px solid #ffffff55; box-shadow: inset -4px -5px 0 #00000033, inset 3px 3px 0 #ffffff55; font-variant-numeric: tabular-nums; }
.orb.unk { background: #120f26 !important; color: var(--dim); border-style: dashed; box-shadow: none; cursor: pointer; }
.orb.empty { background: transparent !important; border: 2px dashed #2c2560; box-shadow: none; cursor: pointer; }

.npc { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; }
.bubble { background: #120f26; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 12.5px; margin-top: 5px; min-height: 20px; }
.spots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.spot { text-align: left; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 8px; font-size: 12.5px; cursor: pointer; min-height: 44px; }
.spot.done { opacity: .7; }
.spot b { display: block; font-size: 12.5px; }
.townchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.townchips::-webkit-scrollbar { display: none; }
.townchips button { flex: none; }
.town-hero { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); height: 110px; }
.town-hero canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.town-hero .cap { position: absolute; left: 10px; bottom: 8px; right: 10px; text-shadow: 0 2px 0 #000; }
.town-hero .cap b { font-family: var(--display); font-weight: 400; font-size: 20px; display: block; }

.slot { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
.slot div { width: 58px; height: 58px; border-radius: 10px; background: #0e0b1f; border: 2px solid var(--gold); font-size: 30px; display: flex; align-items: center; justify-content: center; }

.subtabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ach { border: 1px solid var(--line); border-radius: 9px; padding: 7px; font-size: 12px; background: var(--surface); }
.ach.done { border-color: #d9ad3a; background: linear-gradient(180deg, #3a3060, #2b2352); }
.ach b { display: block; font-size: 12.5px; }
.ach:not(.done) b { color: var(--muted); }

/* ───── 탭 ───── */
#tabs {
  flex: none; display: grid; grid-template-columns: repeat(7, 1fr);
  background: #120f26; border-top: 1px solid var(--line);
  padding-bottom: var(--tabs-sab);
}
#tabs button { border: 0; background: transparent; padding: 7px 0 6px; display: grid; justify-items: center; gap: 1px; font-size: 10.5px; color: var(--dim); cursor: pointer; position: relative; }
#tabs button .i { font-size: 17px; line-height: 1.1; filter: grayscale(.6); }
#tabs button.on { color: #fff; }
#tabs button.on .i { filter: none; }
#tabs button.on::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 2px; background: var(--red); border-radius: 0 0 2px 2px; }
#tabs button .dot { position: absolute; top: 5px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px #120f26; }

/* ───── 대화 ───── */
#dlg { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(180deg, #05030dbb, #05030dcc 55%); padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#dlg .box { max-width: 560px; width: 100%; margin: 0 auto; position: relative; }
#dlg .por { width: 112px; height: 112px; image-rendering: pixelated; display: block; margin: 0 0 -6px 6px; position: relative; z-index: 1; filter: drop-shadow(0 4px 0 #0008); }
#dlg .panel { background: #1d1839f2; border: 2px solid #5a4fb0; border-radius: 14px; padding: 14px 14px 12px; min-height: 118px; box-shadow: 0 8px 0 #0008; }
#dlg .who { display: inline-block; font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: #0e0b1f; border: 1px solid currentColor; margin-bottom: 7px; }
#dlg .txt { font-size: 15.5px; line-height: 1.6; min-height: 50px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
#dlg .txt.sys { color: #d8d2f5; font-style: normal; }
#dlg .txt.big { font-family: var(--display); font-size: 21px; line-height: 1.35; }
#dlg .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: var(--dim); }
#dlg .skip { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; background: #1d1839; border-color: #5a4fb0; color: #fff; }
#dlg .caret { animation: blink 1s steps(2) infinite; color: var(--red); }
@keyframes blink { 50% { opacity: 0; } }
.fx-shake { animation: shake .35s linear; }
@keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, -1px); } 80% { transform: translate(3px, 1px); } }
.fx-glitch .txt { animation: glitch .5s steps(3) 2; }
@keyframes glitch { 0% { text-shadow: 2px 0 #ff00c8, -2px 0 #00f0ff; transform: skewX(4deg); } 50% { text-shadow: -3px 0 #ff00c8, 3px 0 #00f0ff; transform: skewX(-6deg); } 100% { text-shadow: none; transform: none; } }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; transition: opacity .5s; }

/* ───── 모달 & 토스트 ───── */
#modal { position: fixed; inset: 0; z-index: 40; background: #05030dcc; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .mbox { width: 100%; max-width: 420px; max-height: 88vh; overflow: auto; background: var(--bg2); border: 2px solid #5a4fb0; border-radius: 14px; padding: 14px; box-shadow: 0 10px 0 #0008; }
#modal h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0 0 8px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.keypad button { height: 48px; font-size: 18px; }
.pwshow { font-family: var(--display); font-size: 28px; text-align: center; letter-spacing: .1em; background: #0e0b1f; border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 52px; }
textarea { width: 100%; min-height: 96px; background: #0e0b1f; color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px; font: 12px/1.4 monospace; user-select: text; -webkit-user-select: text; }
#toasts { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 70; display: grid; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: #1d1839f5; border: 1px solid #5a4fb0; border-left: 4px solid var(--gold); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 0 #0007; animation: tin .25s ease-out; display: flex; gap: 8px; align-items: center; }
.toast img { width: 30px; height: 30px; image-rendering: pixelated; flex: none; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: all .3s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

@media (prefers-reduced-motion: reduce) {
  .fx-shake, .fx-glitch .txt, .toast { animation: none !important; }
}
@media (min-width: 561px) {
  body { background: radial-gradient(circle at 50% 20%, #221b4a, #0b0918 70%); }
}

</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-top">
      <img class="hud-ava" id="hudAva" alt="">
      <div class="hud-id">
        <div class="hud-name" id="hudName">제로</div>
        <div class="hud-cls" id="hudCls">무직</div>
      </div>
      <div class="hud-lv"><small>LEVEL</small><b id="hudLv">1</b></div>
    </div>
    <div class="bar" id="expBar"><i></i><span></span></div>
    <div class="chips">
      <span class="chip c-gold"><span class="ic">●</span><b id="hudGold">0</b></span>
      <span class="chip c-frag" id="hudFragChip" hidden><span class="ic">◆</span><b id="hudFrag">0</b></span>
      <span class="chip c-dps"><span class="ic">⚔</span><b id="hudDps">0</b>/초</span>
      <span class="chip c-cyan" id="hudSp" hidden>SP&nbsp;<b>0</b></span>
    </div>
  </header>

  <section id="battle" aria-label="전투 화면. 터치하면 공격하고 경험치를 얻습니다">
    <canvas id="cv"></canvas>
    <div class="bt-top">
      <div class="zone-lbl" id="zoneLbl"></div>
      <div class="bt-nav">
        <button id="zPrev" type="button" aria-label="이전 구역">◀</button>
        <button id="zNext" type="button" aria-label="다음 구역">▶</button>
        <button id="zAuto" type="button">자동</button>
      </div>
    </div>
    <div class="skills" id="skillBar"></div>
  </section>

  <main id="panel"></main>

  <nav id="tabs" aria-label="메뉴">
    <button type="button" data-tab="stats"><span class="i">📊</span>능력</button>
    <button type="button" data-tab="equip"><span class="i">⚔️</span>장비</button>
    <button type="button" data-tab="allies"><span class="i">👥</span>동료</button>
    <button type="button" data-tab="class"><span class="i">👑</span>전직</button>
    <button type="button" data-tab="town"><span class="i">🗺️</span>마을</button>
    <button type="button" data-tab="rebirth"><span class="i">◆</span>환생</button>
    <button type="button" data-tab="more"><span class="i">☰</span>더보기</button>
  </nav>
</div>

<div id="dlg" hidden>
  <button class="btn ghost sm skip" id="dlgSkip" type="button">건너뛰기 ▶▶</button>
  <div class="box" id="dlgBox">
    <img class="por" id="dlgPor" alt="">
    <div class="panel">
      <div class="who" id="dlgWho"></div>
      <div class="txt" id="dlgTxt"></div>
      <div class="nav"><span id="dlgCount"></span><span class="caret">▼ 터치</span></div>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>

/* 숫자 표기 & 공용 수학 유틸 */
(function () {
  'use strict';
  const OF = (globalThis.OF = globalThis.OF || {});
  const MAX = Number.MAX_VALUE;

  const KR_UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극',
    '항하사', '아승기', '나유타', '불가사의', '무량대수'];
  const EN_UNITS = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

  let notation = 'kr';

  function setNotation(n) { notation = n; }
  function getNotation() { return notation; }

  function trimFixed(v, digits) {
    let s = v.toFixed(digits);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function sig4(v) {
    // v in [1, 10000)
    if (v >= 1000) return String(Math.floor(v));
    if (v >= 100) return trimFixed(Math.floor(v * 10) / 10, 1);
    if (v >= 10) return trimFixed(Math.floor(v * 100) / 100, 2);
    return trimFixed(Math.floor(v * 1000) / 1000, 3);
  }

  function sci(n) {
    let e = Math.floor(Math.log10(n));
    let m = n / Math.pow(10, e);
    if (!isFinite(m)) { m = n / 1e300 / Math.pow(10, e - 300); }
    if (m >= 9.995) { m /= 10; e += 1; }
    return m.toFixed(2) + 'e' + e;
  }

  function alpha(idx) {
    // 12 -> aa, 13 -> ab ...
    const i = idx - EN_UNITS.length;
    const a = Math.floor(i / 26), b = i % 26;
    return String.fromCharCode(97 + a) + String.fromCharCode(97 + b);
  }

  /** 큰 수 포맷 */
  function fmt(n) {
    if (n === Infinity) return '∞';
    if (n === -Infinity) return '-∞';
    if (typeof n !== 'number' || isNaN(n)) return 'NaN';
    if (n < 0) return '-' + fmt(-n);
    if (n < 1e4) {
      if (n < 10 && n % 1 !== 0) return trimFixed(n, 2);
      if (n < 100 && n % 1 !== 0) return trimFixed(n, 1);
      return Math.floor(n).toLocaleString('en-US');
    }
    if (notation === 'sci') return sci(n);
    if (notation === 'en') {
      const idx = Math.floor(Math.log10(n) / 3);
      const v = n / Math.pow(10, idx * 3);
      const unit = idx < EN_UNITS.length ? EN_UNITS[idx] : alpha(idx);
      if (!isFinite(v) || idx > 12 + 26 * 26) return sci(n);
      return sig4(v) + unit;
    }
    // 한국식 만 단위
    const u = Math.floor(Math.log10(n) / 4);
    if (u <= 17) {
      let v = n / Math.pow(10, u * 4);
      if (v >= 10000) return sig4(v / 10000) + KR_UNITS[Math.min(u + 1, 17)];
      return sig4(v) + KR_UNITS[u];
    }
    return sci(n);
  }

  /** 정수 레벨 등 짧은 표기 */
  function fmtInt(n) {
    if (n < 1e4) return Math.floor(n).toLocaleString('en-US');
    return fmt(n);
  }

  function fmtMult(n) {
    if (n < 1e4) return '×' + (n < 10 ? trimFixed(n, 2) : n < 100 ? trimFixed(n, 1) : Math.floor(n).toLocaleString('en-US'));
    return '×' + fmt(n);
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + '시간 ' + m + '분';
    if (m > 0) return m + '분 ' + s + '초';
    return s + '초';
  }

  function fmtPct(v) { return trimFixed(v * 100, 1) + '%'; }

  /** 유한 보정: 무한/NaN → MAX */
  function fin(x) {
    if (x !== x) return 0; // NaN
    if (x > MAX) return MAX;
    if (x < -MAX) return -MAX;
    return x;
  }

  function log10(x) { return x > 0 ? Math.log10(x) : 0; }
  function pow10(x) { return x > 308.25 ? MAX : Math.pow(10, x); }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  /** 등비 비용 합: base*r^n 부터 k개 */
  function geoSum(base, r, n, k) {
    // log-safe
    const first = base * Math.pow(r, n);
    if (k <= 0) return 0;
    const s = first * (Math.pow(r, k) - 1) / (r - 1);
    return fin(s);
  }
  /** 가진 돈으로 살 수 있는 최대 개수 */
  function geoMaxAfford(base, r, n, money) {
    const first = base * Math.pow(r, n);
    if (!(money >= first)) return 0;
    const k = Math.floor(Math.log(money * (r - 1) / first + 1) / Math.log(r));
    let kk = Math.max(0, k);
    // 부동소수 보정
    while (kk > 0 && geoSum(base, r, n, kk) > money) kk--;
    return kk;
  }

  // 결정적 난수 (스프라이트/이름 생성용)
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

    let a = seed >>> 0;

      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  OF.num = { fmt, fmtInt, fmtMult, fmtTime, fmtPct, fin, log10, pow10, clamp, geoSum, geoMaxAfford,

})();

        if (!compUnlocked(s, i)) continue;
        const c = compCost(i, s.comps[COMPANIONS[i].id] || 0, 1);

    const lg = Math.log10(S.exp);

  function updateHud() {
    const d = E.derive(S);
    setT($('hudLv'), fmtInt(S.level));

    setT($('hudCls'), E.className(S));

      const town = TOWNS[E.townOf(z)];
      let sub;
      if (S.bf && S.enemy && S.enemy.kind >= 1) sub = (S.enemy.kind === 2 ? '마을 보스' : '우두머리') + ' · ' + Math.max(0, S.bf.time).toFixed(1) + '초';
      else if (z >= S.maxZone) sub = '처치 ' + S.kills + '/' + BAL.killsPerZone + (E.isBossZone(z + 1) ? ' · 다음: 보스' : '');

      lbl = '<b>' + E.zoneLabel(z) + ' ' + esc(town.field) + '</b><small>' + sub + '</small>';

    const za = $('zAuto');
    za.className = S.autoAdvance ? 'on' : (S.maxZone > S.zone ? 'retry' : '');

    $('zNext').disabled = S.zone >= S.maxZone;

  function renderSkillBar() {
    const bar = $('skillBar');
    const list = SKILLS.filter((sk) => E.skillUnlocked(S, sk));
    const key = list.map((s) => s.id).join(',');
    if (bar._k === key) return;
    bar._k = key;
    let h = '';
    if (list.length >= 3) h += '<button class="skill all" type="button" data-sk="*" aria-label="모든 스킬 사용">ALL</button>';
    for (const sk of list) h += '<button class="skill" type="button" data-sk="' + sk.id + '" title="' + esc(sk.name + ': ' + sk.desc) + '" aria-label="' + esc(sk.name) + '">' + sk.icon + '<i class="cd"></i><span class="t"></span></button>';
    bar.innerHTML = h;
  }
  function updateSkillBar() {
    renderSkillBar();
    for (const b of $('skillBar').querySelectorAll('[data-sk]')) {
      const id = b.dataset.sk;
      if (id === '*') continue;
      const sk = SKILLS.find((x) => x.id === id);
      const k = S.sk[id] || { until: 0, cd: 0 };
      const on = k.until > S.t;
      const cdLeft = Math.max(0, k.cd - S.t);
      b.classList.toggle('active', on);
      b.querySelector('.cd').style.height = on ? '0%' : (cdLeft > 0 ? (cdLeft / E.skillCd(S, sk) * 100).toFixed(0) + '%' : '0%');
      setT(b.querySelector('.t'), on ? Math.ceil(k.until - S.t) + '' : cdLeft > 0 ? Math.ceil(cdLeft) + '' : '');
    }
  }
  function updateTabDots(d) {
    const dots = {
      stats: S.sp >= 1 && !S.autoAlloc,
      class: CLASSES.some((c, i) => E.canPromote(S, i).ok),
      allies: COMPANIONS.some((c, i) => E.compUnlocked(S, i) && !(S.comps[c.id] > 0)),
      rebirth: E.rebirthUnlocked(S) && E.fragGain(S) >= Math.max(1, S.fragsTotal),
    };
    for (const b of $('tabs').children) {
      const on = !!dots[b.dataset.tab];
      let dot = b.querySelector('.dot');
      if (on && !dot) { dot = document.createElement('i'); dot.className = 'dot'; b.appendChild(dot); }
      else if (!on && dot) dot.remove();
    }
  }

      case 'buyN': ui.buyN = arg === 'max' ? 'max' : +arg; AU.click(); renderPanel(); break;
      case 'buyEq': { const i = +arg; const k = buyCount('e', i); if (E.buyEquip(S, i, ui.buyN === 'max' ? 'max' : k)) AU.click(); updateBinds(); break; }
      case 'buyComp': { const i = +arg; const k = buyCount('c', i); if (E.buyComp(S, i, ui.buyN === 'max' ? 'max' : k)) AU.click(); updateBinds(); break; }
      case 'autoBuy': S.autoBuy = !S.autoBuy; AU.click(); renderPanel(); break;
      case 'promote': if (E.promote(S, +arg)) { afterPromote(); } break;
      case 'promoteMax': { let n = 0; const li = curLine(); while (li >= 0 && E.promote(S, li) && n < 200) n++; if (n) afterPromote(n); break; }
      case 'pw': openPw(arg); break;
      case 'pwKey': pwKey(arg); break;
      case 'orbHint': ui.hintShown[arg] = true; AU.click(); renderPanel(); break;
      case 'bagEmpty': S.misc.bagTaps = (S.misc.bagTaps || 0) + 1; AU.click(); if (S.misc.bagTaps >= 10 && E.grantOrb(S, 'p4')) { processEvents(); renderPanel(); } else if (S.misc.bagTaps < 10) toast('…빈 칸이다. (' + S.misc.bagTaps + ')'); break;
      case 'portrait': S.misc.portraitTaps = (S.misc.portraitTaps || 0) + 1; AU.click(); if (S.misc.portraitTaps >= 7 && E.grantOrb(S, 'y4')) processEvents(); else if (S.misc.portraitTaps < 7) toast('거울 속의 나… (' + S.misc.portraitTaps + ')'); break;
      case 'town': ui.townSel = +arg; AU.click(); renderPanel(true); break;
      case 'goTown': { const t = +arg; const z0 = t * BAL.zonesPerTown + 1; const z = Math.min(S.maxZone, z0 + BAL.zonesPerTown - 1); E.setZone(S, z); S.autoAdvance = z >= S.maxZone; AU.click(); toast(TOWNS[t].field + '(으)로 이동했습니다.'); updateHud(); break; }
      case 'talk': talk(arg); break;
      case 'spot': spot(arg); break;
      case 'slot': slot(+arg); break;
      case 'rebirth': confirmRebirth(); break;
      case 'doRebirth': doRebirth(); break;
      case 'buyFrag': if (E.buyFrag(S, arg)) { AU.click(); updateBinds(); } break;
      case 'sub': ui.sub = arg; AU.click(); renderPanel(true); break;
      case 'replay': startScene(arg, true); break;
      case 'notation': S.settings.notation = arg; N.setNotation(arg); renderPanel(); updateHud(); break;
      case 'toggle': S.settings[arg] = !S.settings[arg]; AU.setEnabled(S.settings.sound); AU.click(); renderPanel(); break;
      case 'saveNow': OF.main.save(); toast('저장했습니다.'); break;
      case 'export': exportSave(); break;
      case 'import': importSave(); break;
      case 'doImport': doImport(); break;
      case 'copyAgain': copyText($('saveCode').value); break;
      case 'reset': confirmReset(); break;
      case 'doReset': OF.main.hardReset(); break;
      case 'closeModal': closeModal(); break;
      case 'ver': S.misc.verTaps = (S.misc.verTaps || 0) + 1; if (S.misc.verTaps >= 5 && E.grantOrb(S, 'o4')) processEvents(); else if (S.misc.verTaps < 5) toast('build ∞ (' + S.misc.verTaps + ')'); break;
    }
  }
  function afterPromote(n) {
    AU.promote();
    const cc = E.curClass(S);
    toast('<b style="color:' + cc.color + '">전직!</b> ' + esc(E.className(S)) + (n > 1 ? ' (+' + n + '차)' : ''), 'button');
    burst(W * 0.2, H * 0.5, cc.color, 24);
    renderSkillBar();
    renderPanel();
  }

  function talk(arg) {
    const [t, id] = arg.split('|');
    const n = STY.NPCS[+t].find((x) => x.id === id);
    const key = t + ':' + id;
    const c = (S.talks[key] || 0) + 1;
    S.talks[key] = c;
    ui.npcSay[key] = n.lines[(c - 1) % n.lines.length];
    AU.blip();
    if (n.orbAt && c >= n.orbAt[0]) { if (E.grantOrb(S, n.orbAt[1])) processEvents(); }
    renderPanel();
  }
  function spot(arg) {
    const [t, i] = arg.split('|').map(Number);
    const sp = STY.SPOTS[t][i];
    const key = t + ':' + sp.id;
    ui.spotSay[t] = sp.text;
    if (!S.spots[key]) {
      S.spots[key] = true;
      const r = sp.reward;
      if (r.orb) { E.grantOrb(S, r.orb); processEvents(); }
      if (r.gold) { const g = E.killGold(Math.max(S.zone, t * BAL.zonesPerTown + 1)) * r.gold * E.derive(S).goldMult; E.addGold(S, g); toast('● +' + fmt(g) + ' 골드를 주웠다!'); AU.orb(); }
      if (r.lore) { toast('📜 설정집에 기록됨: ' + esc(STY.LORE[r.lore][0])); AU.click(); }
    } else AU.click();
    renderPanel();
  }
  function slot(frac) {
    const bet = Math.floor(S.gold * frac);
    if (bet < 1) return;
    S.gold -= bet;
    S.misc.spins = (S.misc.spins || 0) + 1;
    const sym = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
    const r = Math.random();
    let res, mult;
    const pity = !S.flags.jackpot && S.misc.spins >= 15;
    if (pity || r < 0.012) { res = ['7️⃣', '7️⃣', '7️⃣']; mult = 20; }
    else if (r < 0.06) { const s = sym[Math.floor(Math.random() * 4)]; res = [s, s, s]; mult = 5; }
    else if (r < 0.30) { const s = sym[Math.floor(Math.random() * 5)]; let o; do { o = sym[Math.floor(Math.random() * 5)]; } while (o === s); res = [s, s, o].sort(() => Math.random() - 0.5); mult = 2; }
    else { do { res = [0, 1, 2].map(() => sym[Math.floor(Math.random() * 5)]); } while (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]); mult = 0; }
    ui.slot = res;
    const win = bet * mult;
    if (win > 0) E.addGold(S, win);
    if (mult === 20) {
      ui.slotMsg = (pity ? '럭키: 「불쌍해서 드려요…」 ' : '') + '★ JACKPOT! +' + fmt(win);
      S.flags.jackpot = true;
      AU.boss();
      if (E.grantOrb(S, 'y2')) processEvents();
    } else if (mult) { ui.slotMsg = '당첨! ×' + mult + ' (+' + fmt(win) + ')'; AU.orb(); }
    else { ui.slotMsg = '꽝! -' + fmt(bet) + ' 골드'; AU.fail(); }
    renderPanel();
  }

  /* 비밀번호 */
  function openPw(line) {
    ui.pwInput = ''; ui.pwLine = line;
    const c = CLASSES.find((x) => x.id === line);
    const col = colorOfLine(line);
    const oc = ORB_COLORS[col];
    const found = ORBS.filter((o) => o.c === col && S.orbs[o.id]);
    let h = '<h2 style="color:' + c.color + '">' + esc(c.name) + ' 계열 해금</h2><div class="small">' + oc.name + ' 4개의 숫자를 모두 더한 값을 입력하세요.</div>' +
      '<div class="orbs" style="margin:8px 0">' + found.map((o) => '<div class="orb" style="background:' + oc.color + '">' + o.v + '</div>').join('') +
      Array(4 - found.length).fill('<div class="orb unk">?</div>').join('') + '</div>' +
      '<div class="pwshow" id="pwShow">&nbsp;</div><div class="tiny" id="pwMsg" style="min-height:16px;margin-top:4px"></div><div class="keypad">';
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok']) {
      h += '<button type="button" class="btn ' + (k === 'ok' ? 'gold' : k === 'del' ? 'ghost' : '') + '" data-act="pwKey" data-arg="' + k + '">' + (k === 'del' ? '←' : k === 'ok' ? '확인' : k) + '</button>';
    }
    h += '</div><button type="button" class="btn ghost wide" style="margin-top:8px" data-act="closeModal">닫기</button>';
    openModal(h);
  }
  function pwKey(k) {
    AU.click();
    if (k === 'del') ui.pwInput = ui.pwInput.slice(0, -1);
    else if (k === 'ok') {
      if (E.tryPassword(S, ui.pwLine, ui.pwInput)) {
        const c = CLASSES.find((x) => x.id === ui.pwLine);
        closeModal();
        AU.promote();
        toast('<b style="color:' + c.color + '">' + esc(c.name) + '</b> 계열이 해금되었습니다! 이제 전직할 수 있어요.', 'button');
        renderPanel();
        return;
      }
      $('pwMsg').textContent = '틀렸습니다. 구슬을 모두 찾았는지, 더하기가 맞는지 확인하세요.';
      $('mbox').classList.remove('fx-shake'); void $('mbox').offsetWidth; $('mbox').classList.add('fx-shake');
      AU.fail();
      ui.pwInput = '';
    } else if (ui.pwInput.length < 8) ui.pwInput += k;
    $('pwShow').innerHTML = ui.pwInput ? esc(ui.pwInput) : '&nbsp;';
  }

  /* 환생 */
  function confirmRebirth() {
    const g = E.fragGain(S);
    openModal('<h2>환생할까요?</h2><div class="small">버튼을 길게 누르면 세계가 한 바퀴 돕니다.</div>' +
      '<div class="card" style="margin:10px 0"><div class="kv"><span>획득</span><span class="c-frag">◆ +' + fmt(g) + '</span><span>누적 보너스</span><span>' + fmtMult(1 + BAL.fragPassive * S.fragsTotal) + ' → ' + fmtMult(1 + BAL.fragPassive * (S.fragsTotal + g)) + '</span><span>시작 구역</span><span>' + E.zoneLabel(E.warpZone(S)) + '</span></div></div>' +
      '<div class="tiny">레벨·스탯·골드·장비·동료 레벨·구역 진행이 초기화됩니다. 전직·유물·구슬·업적·기억 조각은 유지됩니다.</div>' +
      '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost grow" data-act="closeModal">취소</button><button type="button" class="btn red grow" data-act="doRebirth">환생하기</button></div>');
  }
  function doRebirth() {
    closeModal();
    const g = E.rebirth(S);
    if (!g) return;
    AU.rebirth();
    flash();
    ui.floats = []; ui.parts = [];
    toast('◆ 기억 조각 +' + fmt(g) + '! 다시, 처음부터.', 'button');
    processEvents();
    renderPanel(true);
    updateHud();
  }

  /* 저장 */
  function copyText(s) {
    try {
      navigator.clipboard.writeText(s).then(() => toast('복사했습니다.'), () => { selectCode(); toast('자동 복사가 막혔어요. 코드를 길게 눌러 복사하세요.'); });
    } catch (e) { selectCode(); toast('코드를 길게 눌러 복사하세요.'); }
  }
  function selectCode() { const ta = $('saveCode'); if (ta) { ta.focus(); ta.select(); } }
  function exportSave() {
    const code = OF.main.exportCode();
    openModal('<h2>저장 코드</h2><div class="small">이 코드를 다른 기기의 [불러오기]에 붙여 넣으세요.</div><textarea id="saveCode" readonly>' + esc(code) + '</textarea>' +
      '<div class="row" style="margin-top:8px"><button type="button" class="btn grow" data-act="copyAgain">복사</button><button type="button" class="btn ghost grow" data-act="closeModal">닫기</button></div>');
    copyText(code);
  }
  function importSave() {
    openModal('<h2>불러오기</h2><div class="small">저장 코드를 붙여 넣으세요. 현재 진행은 덮어써집니다.</div><textarea id="loadCode" placeholder="저장 코드"></textarea><div class="tiny" id="loadMsg"></div>' +
      '<div class="row" style="margin-top:8px"><button type="button" class="btn ghost grow" data-act="closeModal">취소</button><button type="button" class="btn gold grow" data-act="doImport">불러오기</button></div>');
  }
  function doImport() {
    const v = $('loadCode').value.trim();
    if (!OF.main.importCode(v)) $('loadMsg').textContent = '코드를 읽을 수 없습니다. 전체를 정확히 붙여 넣었는지 확인하세요.';
  }
  function confirmReset() {
    openModal('<h2>처음부터 다시?</h2><div class="small">모든 진행(전직, 유물, 구슬, 업적 포함)이 영구히 삭제됩니다. 되돌릴 수 없어요.</div>' +
      '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost grow" data-act="closeModal">취소</button><button type="button" class="btn red grow" data-act="doReset">전부 삭제</button></div>');
  }

  /* ───────── 모달 / 토스트 / 플래시 ───────── */
  function openModal(html) { $('mbox').innerHTML = html; $('modal').hidden = false; }
  function closeModal() { $('modal').hidden = true; $('mbox').innerHTML = ''; }
  function toast(html, por) {
    const box = $('toasts');
    while (box.children.length >= 3) box.firstChild.remove();
    const d = document.createElement('div');
    d.className = 'toast';
    d.innerHTML = (por ? '<img alt="" src="' + SP.portraitURL(por, 2) + '">' : '') + '<div>' + html + '</div>';
    box.appendChild(d);
    setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, 2800);
  }
  function flash() {
    const f = $('flash');
    f.style.transition = 'none'; f.style.opacity = '0.85';
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = 'opacity .6s'; f.style.opacity = '0'; }));
  }

  /* ───────── 대화 ───────── */
  function queueScene(id) { if (S.seen[id] || ui.dlgQueue.includes(id)) return; ui.dlgQueue.push(id); }
  function pumpDialogue() { if (ui.dlg || !ui.dlgQueue.length || !$('modal').hidden) return; startScene(ui.dlgQueue.shift()); }
  function startScene(id, replay) {
    const sc = STY.SCENES[id];
    if (!sc) return;
    if (!replay) S.seen[id] = true;
    ui.dlg = { id, lines: sc.lines, i: -1, shown: 0, full: '', replay: !!replay, acc: 0 };
    $('dlg').hidden = false;
    dlgNext();
  }
  function dlgNext() {
    const d = ui.dlg;
    d.i++;
    if (d.i >= d.lines.length) return dlgEnd();
    const [who, text, fx] = d.lines[d.i];
    const ch = STY.CHARS[who] || STY.CHARS.sys;
    const por = $('dlgPor');
    if (who === 'sys') { por.style.visibility = 'hidden'; }
    else { por.style.visibility = 'visible'; por.src = SP.portraitURL(who, 6); }
    const wEl = $('dlgWho');
    wEl.hidden = who === 'sys';
    wEl.textContent = ch.name; wEl.style.color = ch.color;
    const tx = $('dlgTxt');
    tx.className = 'txt' + (who === 'sys' ? ' sys' : '') + (fx === 'big' ? ' big' : '');
    tx.textContent = '';
    d.full = text; d.shown = 0; d.acc = 0;
    $('dlgCount').textContent = (d.i + 1) + ' / ' + d.lines.length;
    const box = $('dlgBox');
    box.classList.remove('fx-shake', 'fx-glitch'); void box.offsetWidth;
    if (fx === 'shake') { box.classList.add('fx-shake'); vibrate(30); AU.hit(); }
    if (fx === 'glitch') box.classList.add('fx-glitch');
    if (fx === 'flash') { flash(); AU.orb(); }
  }
  function dlgTick(dt) {
    const d = ui.dlg;
    if (!d || d.shown >= d.full.length) return;
    d.acc += dt;
    const step = 0.026;
    let n = 0;
    while (d.acc >= step && d.shown < d.full.length) { d.acc -= step; d.shown++; n++; }
    if (n) {
      $('dlgTxt').textContent = d.full.slice(0, d.shown);
      if (d.shown % 3 === 0) AU.blip();
    }
  }
  function dlgAdvance() {
    const d = ui.dlg;
    if (!d) return;
    if (d.shown < d.full.length) { d.shown = d.full.length; $('dlgTxt').textContent = d.full; return; }
    dlgNext();
  }
  function dlgSkip() { if (ui.dlg) { ui.dlg.i = ui.dlg.lines.length; dlgEnd(); } }
  function dlgEnd() {
    const d = ui.dlg;
    ui.dlg = null;
    $('dlg').hidden = true;
    const sc = STY.SCENES[d.id];
    if (!d.replay && sc.orb) { E.grantOrb(S, sc.orb); }
    if (!d.replay && d.id === 'ending') showCredits();
    if (!d.replay && S.enemy && S.enemy.kind >= 1 && S.enemy.kind < 3 && S.bf) { S.bf.time = S.bf.maxTime; const dd = E.derive(S); S.bf.php = S.bf.pmax = dd.hp; }
    processEvents();
    renderPanel();
    setTimeout(pumpDialogue, 250);
  }
  function showCredits() {
    const T = S.tot;
    openModal('<h2 style="text-align:center;color:var(--red)">OVERFLOW</h2><div style="text-align:center"><img class="pix" src="' + SP.portraitURL('button', 5) + '" width="90" height="90" alt=""></div>' +
      '<p class="small" style="text-align:center">캡 없는 소년의 이야기는 여기서 끝나지 않습니다.<br>엔딩 보너스 <b class="c-gold">모든 공격력·체력·경험치·골드 ×100만</b>이 영구 적용되었습니다.</p>' +
      '<div class="card kv"><span>플레이 시간</span><span>' + N.fmtTime(T.playTime) + '</span><span>최고 레벨</span><span>' + fmtInt(T.maxLevel) + '</span><span>탭</span><span>' + fmt(T.taps) + '</span><span>환생</span><span>' + S.rebirths + '회</span><span>처치</span><span>' + fmt(T.kills) + '</span></div>' +
      '<p class="tiny" style="text-align:center">무한 렙업: OVERFLOW — 플레이해 주셔서 고맙습니다.</p><button type="button" class="btn gold wide" data-act="closeModal">계속하기</button>');
  }

  /* ───────── 이벤트 처리 ───────── */
  function processEvents() {
    if (!S.events.length) return;
    const G = geom();
    let needPanel = false;
    for (const ev of S.events) {
      switch (ev.type) {
        case 'levelup': {
          const gained = ev.to - ev.from;
          ui.lvAcc += gained;
          if (!ui.lvFx || ui.lvFx.life < 0.6) { ui.lvFx = { life: 1.2, gained: ui.lvAcc }; ui.lvAcc = 0; AU.level(); }
          for (const id of STY.scenesFor(ev, S.seen)) queueScene(id);
          let qi = S.misc.quip || 0, q = null;
          while (STY.LEVEL_QUIPS[qi] && S.tot.maxLevel >= STY.LEVEL_QUIPS[qi][0]) { q = STY.LEVEL_QUIPS[qi]; qi++; }
          if (q) { S.misc.quip = qi; toast('<b>버튼</b> 「' + esc(q[1]) + '」', 'button'); }
          break;
        }
        case 'kill':
          if (ev.kind === 0) { if (Math.random() < 0.5) burst(G.mx, G.gy - 30, TOWNS[E.townOf(Math.min(ev.z, FINAL_ZONE - 1))].pal[3], 6); }
          else { burst(G.mx, G.gy - 40, '#ffcf4a', 26); ui.shake = 0.25; }
          if (Math.random() < 0.3) AU.kill();
          break;
        case 'bossClear': AU.boss(); addFloat(G.mx, G.gy - 90, '격파!', '#ffcf4a', 24, 1.2); needPanel = true; break;
        case 'bossFail':
          AU.fail();
          toast(ev.reason === 'hp' ? '보스에게 쓰러졌다! <b>체력(VIT)</b>이나 <b>갑옷</b>을 올려 보세요.' : '시간 초과! 공격력을 올리고 <b>재도전</b>하세요.', 'button');
          break;
        case 'bossHit': ui.heroHit = 0.15; if (Math.random() < 0.5) AU.hit(); addFloat(G.hx, G.gy - 80, '-' + fmt(ev.dmg), '#ff4d5e', 13, 0.8); break;
        case 'reach': {
          const scenes = STY.scenesFor(ev, S.seen);
          for (const id of scenes) queueScene(id);
          if ((ev.z - 1) % BAL.zonesPerTown === 0 && ev.z > 1 && !E.isFinal(ev.z)) toast('🗺️ 새 지역: <b>' + esc(TOWNS[E.townOf(ev.z)].name) + '</b>');
          COMPANIONS.forEach((c, i) => { if (c.unlock + 1 === ev.z) toast('👥 동료 합류 가능: <b>' + esc(c.name) + '</b> — [동료] 탭', c.portrait); });
          needPanel = true;
          break;
        }
        case 'relic':
          for (const id of STY.scenesFor(ev, S.seen)) queueScene(id);
          needPanel = true;
          break;
        case 'orb': {
          const o = ORBS.find((x) => x.id === ev.id);
          const oc = ORB_COLORS[o.c];
          toast('<b style="color:' + oc.color + '">' + oc.name + '</b> 발견! 숫자 <b>' + o.v + '</b> — [전직] 탭의 구슬 가방');
          AU.orb();
          needPanel = true;
          break;
        }
        case 'ach': { const a = ACH.find((x) => x.id === ev.id); toast('🏆 업적 달성: <b>' + esc(a.name) + '</b> <span class="tiny">(모든 능력 ×1.03)</span>'); break; }
        case 'promote': renderSkillBar(); break;
        case 'skill': AU.orb(); break;
        case 'rebirth': for (const id of STY.scenesFor(ev, S.seen)) queueScene(id); break;
        case 'overflow':
          AU.overflow(); flash(); ui.shake = 1.2;
          for (const id of STY.scenesFor(ev, S.seen)) queueScene(id);
          needPanel = true;
          break;
      }
    }
    S.events.length = 0;
    if (needPanel && (ui.tab === 'town' || ui.tab === 'class' || ui.tab === 'allies' || ui.tab === 'rebirth')) ui.panelDirty = true;
    pumpDialogue();
  }

  /* ───────── 프레임 ───────── */
  function frame(now, dt) {
    if (ui.dlg) dlgTick(dt);
    processEvents();
    draw(now, dt);
    ui.hudT += dt;
    if (ui.hudT >= 0.1) { ui.hudT = 0; updateHud(); }
    ui.bindT += dt;
    if (ui.bindT >= 0.25) { ui.bindT = 0; updateBinds(); }
    ui.panelT = (ui.panelT || 0) + dt;
    if (ui.panelDirty && ui.panelT >= 1) { ui.panelT = 0; ui.panelDirty = false; renderPanel(); }
  }

  function init(state) {
    S = state;
    N.setNotation(S.settings.notation);
    AU.setEnabled(S.settings.sound);
    cv = $('cv'); ctx = cv.getContext('2d');
    $('hudAva').src = SP.portraitURL('zero', 2);
    bindGlobal();
    resize();
    setTab('stats');
    renderSkillBar();
    updateHud();
    if (!S.seen.prologue) queueScene('prologue');
    pumpDialogue();
  }
  function setState(s) {
    S = s; ui.dlgQueue = []; ui.floats = []; ui.parts = []; ui.npcSay = {}; ui.spotSay = {};
    N.setNotation(S.settings.notation); AU.setEnabled(S.settings.sound);
    $('skillBar')._k = null; renderSkillBar(); setTab('stats'); updateHud();
    if (!S.seen.prologue) queueScene('prologue');
    pumpDialogue();
  }
  function isPaused() { return !!ui.dlg; }

  OF.ui = { init, frame, setState, toast, openModal, closeModal, processEvents, isPaused, resize, renderPanel, playScene: startScene, setTab };
})();

/* ── main.js ── */
/* 부트스트랩: 게임 루프, 저장/불러오기, 오프라인 보상 */
(function () {
  'use strict';
  const OF = globalThis.OF;
  const E = OF.engine, N = OF.num;
  const KEY = 'overflow-levelup-save-v1';
  const STEP = 0.05;
  let S = null, last = 0, acc = 0, started = false;

  function lsGet() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function lsSet(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } }
  function lsDel() { try { localStorage.removeItem(KEY); } catch (e) { /* 무시 */ } }

  function save() { if (S) lsSet(E.serialize(S)); }
  function exportCode() { return btoa(unescape(encodeURIComponent(E.serialize(S)))); }
  function importCode(code) {
    try {
      const json = decodeURIComponent(escape(atob(code.replace(/\s+/g, ''))));
      const s = E.deserialize(json);
      if (!s || typeof s.level !== 'number') return false;
      S = s;
      OF.ui.closeModal();
      OF.ui.setState(S);
      save();
      OF.ui.toast('저장 코드를 불러왔습니다.');
      return true;
    } catch (e) { return false; }
  }
  function hardReset() {
    lsDel();
    S = E.newState();
    OF.ui.closeModal();
    OF.ui.setState(S);
    save();
  }

  function offline(sec) {
    const g = E.offlineGain(S, sec);
    if (!g) return;
    E.applyOffline(S, g);
    S.events.length = 0;
    OF.ui.openModal('<h2>다녀오셨어요?</h2><div class="small">자리를 비운 동안 동료들이 대신 싸웠습니다.</div>' +
      '<div class="card kv" style="margin:10px 0"><span>자리 비움</span><span>' + N.fmtTime(g.sec) + '</span><span>처치</span><span>' + N.fmt(Math.floor(g.kills)) + '</span>' +
      '<span>경험치</span><span class="c-cyan">+' + N.fmt(g.exp) + '</span><span>골드</span><span class="c-gold">+' + N.fmt(g.gold) + '</span></div>' +
      '<div class="tiny">동료와 자동 손가락의 힘으로 계산됩니다 (효율 50%, 최대 ' + (2 + E.fu(S, 'f_off')) + '시간).</div>' +
      '<button type="button" class="btn gold wide" style="margin-top:10px" data-act="closeModal">좋아!</button>');
  }

  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt < 0) dt = 0;
    if (dt > 2) {
      // 백그라운드에서 돌아옴
      if (dt > 60) offline(dt);
      else for (let t = 0; t < dt; t += STEP) E.tick(S, STEP);
      dt = 0;
    }
    if (!OF.ui.isPaused()) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 40) { E.tick(S, STEP); acc -= STEP; n++; }
      if (n >= 40) acc = 0;
    }
    OF.ui.frame(now, Math.min(dt, 0.1));
    requestAnimationFrame(loop);
  }

  function start(data) {
    if (started) return;
    started = true;
    let raw = (data && data.save) || lsGet();
    let away = 0;
    if (raw) {
      try { S = E.deserialize(raw); away = (Date.now() - (S.lastSave || Date.now())) / 1000; }
      catch (e) { S = null; }
    }
    if (!S) S = E.newState();
    OF.ui.init(S);
    if (away > 60 && S.seen.prologue) offline(away);
    setInterval(save, 15000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    last = performance.now();
    requestAnimationFrame(loop);
  }

  const hot = globalThis.window && window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ save: S ? E.serialize(S) : null })); } catch (e) { /* 무시 */ }

  OF.main = { save, exportCode, importCode, hardReset, get state() { return S; } };

  function boot() {
    try {
      if (hot && hot.ready) hot.ready(start);
      else start((hot && hot.data) || {});
    } catch (e) { start({}); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
